# Hardcore Stress Test for @veriworkly/site
# Tests extreme concurrency (up to 250+ req/s) against both static & dynamic DB routes.
#
# Usage:
#   npx artillery run --dotenv load-testing/.env --environment local load-testing/scenarios/site-stress.yml
config:
  target: "{{ $processEnvironment.LOCAL_SITE_URL }}"
  processor: "../processors/helpers.cjs"

  environments:
    local:
      target: "{{ $processEnvironment.LOCAL_SITE_URL }}"
    staging:
      target: "{{ $processEnvironment.STAGING_SITE_URL }}"
    production:
      target: "{{ $processEnvironment.PRODUCTION_SITE_URL }}"

  http:
    timeout: 10

  defaults:
    headers:
      user-agent: "veriworkly-stress-test/2.0"

  phases:
    - duration: 30
      arrivalRate: 10
      name: "Warm up"
    - duration: 60
      arrivalRate: 20
      rampTo: 80
      name: "Ramp to heavy load"
    - duration: 120
      arrivalRate: 80
      name: "Sustained heavy load"
    - duration: 60
      arrivalRate: 80
      rampTo: 200
      name: "Ramp to extreme stress"
    - duration: 90
      arrivalRate: 200
      name: "Sustained extreme stress"
    - duration: 30
      arrivalRate: 200
      rampTo: 300
      name: "Breaking point spike"
    - duration: 30
      arrivalRate: 300
      name: "Max concurrency hold"
    - duration: 30
      arrivalRate: 50
      rampTo: 5
      name: "Cool down"

scenarios:
  # Weights add up to 100. Grouped by how the site renders each route, so the report shows
  # which kind of page slows down first:
  #   static/cached  - served from the build or the ISR cache; tests the Node server alone
  #   per request    - renders on every hit and calls the backend; tests site + server together
  #   generated      - CPU work on every request (OG images)
  # Build with the backend running (npm run dev:server first), then next start, so cached
  # pages hold real data. Same scenarios as site.yml; only the load is heavier.
  - name: "Homepage (static)"
    weight: 25
    flow:
      - get:
          url: "/"
          afterResponse: "logUnexpectedStatus"

  - name: "Marketing pages (static)"
    weight: 12
    flow:
      - get:
          url: "/pricing"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/features"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/how-it-works"
          afterResponse: "logUnexpectedStatus"

  - name: "Templates (static)"
    weight: 8
    flow:
      - get:
          url: "/templates"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/templates/resume/resume-executive-clarity"
          afterResponse: "logUnexpectedStatus"

  - name: "Compare and ATS pages (static)"
    weight: 6
    flow:
      - get:
          url: "/compare/rezi"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/ats-checker"
          afterResponse: "logUnexpectedStatus"

  - name: "Release detail (ISR, cached)"
    weight: 6
    flow:
      - get:
          url: "/changelog/v3-30-1"
          afterResponse: "logUnexpectedStatus"

  - name: "Roadmap (cached; per request only if a column fails)"
    weight: 8
    flow:
      - get:
          url: "/roadmap"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/roadmap/todo"
          afterResponse: "logUnexpectedStatus"

  - name: "Changelog list (per request, calls the backend)"
    weight: 8
    flow:
      - get:
          url: "/changelog"
          afterResponse: "logUnexpectedStatus"

  - name: "Stats (per request, calls the backend)"
    weight: 5
    flow:
      - get:
          url: "/stats"
          afterResponse: "logUnexpectedStatus"

  - name: "Programs (per request: flags are read on each hit)"
    weight: 6
    flow:
      - get:
          url: "/affiliate"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/ambassador"
          afterResponse: "logUnexpectedStatus"

  - name: "Ambassador apply (per request, checks the session)"
    weight: 3
    flow:
      - get:
          url: "/ambassador/apply"
          afterResponse: "logUnexpectedStatus"

  - name: "Crawler files (static)"
    weight: 8
    flow:
      - get:
          url: "/sitemap.xml"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/robots.txt"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/llms.txt"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/llms-full.txt"
          afterResponse: "logUnexpectedStatus"

  - name: "OG image (generated, CPU heavy)"
    weight: 5
    flow:
      - get:
          url: "/api/og?title=Load%20test"
          afterResponse: "logUnexpectedStatus"
