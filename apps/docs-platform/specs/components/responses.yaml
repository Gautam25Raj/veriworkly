ValidationError:
  description: |
    Bad Request - The request body or parameters are invalid. `details` lists every failing
    field as `{ path, message }`, `path` being the dotted field path.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"
      example:
        success: false
        statusCode: 400
        message: "Validation failed"
        details:
          - path: "profile.basics.email"
            message: "Invalid email"

UnauthorizedError:
  description: Unauthorized - Authentication failed or session expired.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/UnauthorizedResponse"
      example:
        success: false
        statusCode: 401
        message: "Authentication required"

InsufficientScopeError:
  description: Forbidden - The API key does not carry the scope this operation needs.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"
      example:
        success: false
        statusCode: 403
        message: "This API key does not have permission for this action."

BadRequestError:
  description: Bad Request - The request parameters or body are invalid.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"

NotFoundError:
  description: Not Found - The requested resource does not exist.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"

FeatureDisabledError:
  description: |
    Service Unavailable - This feature is gated behind a feature flag that is currently off
    (`config.growth.affiliateProgramEnabled` / `config.growth.ambassadorProgramEnabled`), which is
    the default in production until the program is explicitly enabled.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"
      example:
        success: false
        statusCode: 503
        message: "The affiliate program is not available yet. Check back soon."
