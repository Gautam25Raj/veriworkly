ValidationError:
  description: Bad Request - The request body or parameters are invalid.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"

UnauthorizedError:
  description: Unauthorized - Authentication failed or session expired.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"
      example:
        success: false
        statusCode: 401
        message: "Authentication required"

BadRequestError:
  description: Bad Request - The request parameters or body are invalid.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"

NotFoundError:
  description: Not Found - The requested resource does not exist.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"

FeatureDisabledError:
  description: |
    Service Unavailable - This feature is gated behind a feature flag that is currently off
    (`config.growth.affiliateProgramEnabled` / `config.growth.ambassadorProgramEnabled`), which is
    the default in production until the program is explicitly enabled.
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ErrorResponse"
      example:
        success: false
        statusCode: 503
        message: "The affiliate program is not available yet. Check back soon."
