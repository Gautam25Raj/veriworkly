# Load test for @veriworkly/blog-platform (default local port 3003).
#
# BLOG_TEST_SLUG (optional, see ../.env.example) points the "Post detail"
# scenario at a real published post. Left unset, that scenario exercises the
# 404 path instead - still fine for a first pass, but add a real slug for
# numbers that reflect actual post-rendering cost.
#
# IMPORTANT: `next dev` is unoptimized. For prod-like numbers:
#   npm run build:blog && npm run start -w @veriworkly/blog-platform -- -p 3003
config:
  target: "{{ $processEnvironment.LOCAL_BLOG_URL }}"
  processor: "../processors/helpers.cjs"

  environments:
    local:
      target: "{{ $processEnvironment.LOCAL_BLOG_URL }}"
    staging:
      target: "{{ $processEnvironment.STAGING_BLOG_URL }}"
    production:
      target: "{{ $processEnvironment.PRODUCTION_BLOG_URL }}"

  http:
    timeout: 15

  defaults:
    headers:
      user-agent: "veriworkly-load-test/1.0"

  phases:
    - duration: 30
      arrivalRate: 1
      name: "Warm up"
    - duration: 60
      arrivalRate: 1
      rampTo: 10
      name: "Ramp to typical load"
    - duration: 120
      arrivalRate: 10
      name: "Sustained typical load"
    - duration: 60
      arrivalRate: 10
      rampTo: 40
      name: "Ramp to peak load"
    - duration: 120
      arrivalRate: 40
      name: "Sustained peak load"
    - duration: 30
      arrivalRate: 40
      rampTo: 80
      name: "Spike"
    - duration: 30
      arrivalRate: 80
      name: "Spike hold"
    - duration: 60
      arrivalRate: 80
      rampTo: 1
      name: "Cool down"

scenarios:
  - name: "Blog homepage"
    weight: 50
    flow:
      - get:
          url: "/"
          afterResponse: "logUnexpectedStatus"

  - name: "Archive"
    weight: 25
    flow:
      - get:
          url: "/archive"
          afterResponse: "logUnexpectedStatus"

  - name: "Post detail"
    weight: 25
    flow:
      - function: "setBlogSlug"
      - get:
          url: "/{{ blogSlug }}"
          afterResponse: "logUnexpectedStatus"
