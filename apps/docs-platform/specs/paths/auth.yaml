sendOtp:
  post:
    tags:
      - Authentication
    operationId: sendOTP
    summary: Send OTP

    description: |
      Emails a one-time password to the given address.

      Authentication is handled by **Better Auth**, mounted at `/api/v1/auth`. Its endpoints return
      Better Auth's own payloads — they are **not** wrapped in the `{ success, message, data }`
      envelope the rest of this API uses.

      Rate limited to 3 requests per minute per IP.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - type
            properties:
              email:
                type: string
                format: email
              type:
                type: string
                enum: [sign-in, email-verification, forget-password]
                description: |
                  Required. Use `sign-in` for the login flow — that is what the VeriWorkly
                  dashboard sends.
          example:
            email: "user@example.com"
            type: "sign-in"
    responses:
      "200":
        description: |
          OTP sent. Returns `{ "success": true }` whether or not the address maps to an existing
          account, so this endpoint cannot be used to enumerate registered emails.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
            example:
              success: true
      "400":
        description: Missing or malformed email address.
      "429":
        description: Too many OTP requests — 3 per minute per IP.

verifyOtp:
  post:
    tags:
      - Authentication
    operationId: verifyOTP
    summary: Sign In With Email OTP

    description: |
      Exchanges a valid OTP for a session. On success the session cookie is set via `Set-Cookie`
      and the session token plus the user record are returned.

      A user is created automatically on first sign-in. Codes expire after 5 minutes and allow 3
      attempts by default. This endpoint returns Better Auth's payload, not the
      `{ success, message, data }` envelope.

      Rate limited to 20 requests per minute per IP — the default for `/api/v1/auth/*`. (A tighter
      5/minute rule exists in configuration but targets `/email-otp/verify-otp`, a path this Better
      Auth version does not expose, so it never applies.)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - otp
            properties:
              email:
                type: string
                format: email
              otp:
                type: string
          example:
            email: "user@example.com"
            otp: "123456"
    responses:
      "200":
        description: OTP verified. Sets the session cookie and returns the session token and user.
        content:
          application/json:
            schema:
              type: object
              required: [token, user]
              properties:
                token:
                  type: string
                  description: Session token for the authenticated session.
                user:
                  type: object
                  additionalProperties: true
      "400":
        description: The OTP is invalid, expired, or the attempt limit was exceeded.
      "429":
        description: Too many requests — 20 per minute per IP.

getSession:
  get:
    tags:
      - Authentication
    operationId: getSession
    summary: Get Current Session

    security:
      - LocalSession: []
      - ProdSession: []
    description: |
      Returns the active session and its user, based on the request's session cookie. Returns
      `null` rather than an error when no valid session cookie is present.

      This endpoint returns Better Auth's payload, not the `{ success, message, data }` envelope.
    responses:
      "200":
        description: The active `{ session, user }` pair, or `null` when the caller has no valid session.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    session:
                      type: object
                      additionalProperties: true
                    user:
                      type: object
                      additionalProperties: true
                - type: "null"

signOut:
  post:
    tags:
      - Authentication
    operationId: signOut
    summary: Sign Out

    security:
      - LocalSession: []
      - ProdSession: []
    description: |
      Revokes the current session and clears the session cookie. Also flushes the server-side
      session cache for that cookie.

      This endpoint returns Better Auth's payload, not the `{ success, message, data }` envelope.
    responses:
      "200":
        description: Signed out. Clears the session cookie.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
            example:
              success: true
