# Load test for @veriworkly/docs-platform (default local port 3002).
#
# IMPORTANT: `next dev` is unoptimized. For prod-like numbers:
#   npm run build:docs && npm run start -w @veriworkly/docs-platform -- -p 3002
config:
  target: "{{ $processEnvironment.LOCAL_DOCS_URL }}"
  processor: "../processors/helpers.cjs"

  environments:
    local:
      target: "{{ $processEnvironment.LOCAL_DOCS_URL }}"
    staging:
      target: "{{ $processEnvironment.STAGING_DOCS_URL }}"
    production:
      target: "{{ $processEnvironment.PRODUCTION_DOCS_URL }}"

  http:
    timeout: 15

  defaults:
    headers:
      user-agent: "veriworkly-load-test/1.0"

  phases:
    - duration: 30
      arrivalRate: 1
      name: "Warm up"
    - duration: 60
      arrivalRate: 1
      rampTo: 10
      name: "Ramp to typical load"
    - duration: 120
      arrivalRate: 10
      name: "Sustained typical load"
    - duration: 60
      arrivalRate: 10
      rampTo: 40
      name: "Ramp to peak load"
    - duration: 120
      arrivalRate: 40
      name: "Sustained peak load"
    - duration: 30
      arrivalRate: 40
      rampTo: 80
      name: "Spike"
    - duration: 30
      arrivalRate: 80
      name: "Spike hold"
    - duration: 60
      arrivalRate: 80
      rampTo: 1
      name: "Cool down"

scenarios:
  - name: "Docs homepage"
    weight: 40
    flow:
      - get:
          url: "/"
          afterResponse: "logUnexpectedStatus"

  - name: "Docs section"
    weight: 35
    flow:
      - get:
          url: "/docs"
          afterResponse: "logUnexpectedStatus"

  - name: "API reference"
    weight: 25
    flow:
      - get:
          url: "/api-reference"
          afterResponse: "logUnexpectedStatus"
