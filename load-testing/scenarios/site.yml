# Load test for @veriworkly/site (marketing site, default local port 3000).
#
# IMPORTANT: `next dev` is unoptimized. For realistic production metrics,
# run against a production build:
#   npm run build -w @veriworkly/site && npm run start -w @veriworkly/site -- -p 3000
#
# Usage:
#   npm run loadtest:site
config:
  target: "{{ $processEnvironment.LOCAL_SITE_URL }}"
  processor: "../processors/helpers.cjs"

  environments:
    local:
      target: "{{ $processEnvironment.LOCAL_SITE_URL }}"
    staging:
      target: "{{ $processEnvironment.STAGING_SITE_URL }}"
    production:
      target: "{{ $processEnvironment.PRODUCTION_SITE_URL }}"

  http:
    timeout: 15

  defaults:
    headers:
      user-agent: "veriworkly-load-test/1.0"

  phases:
    - duration: 30
      arrivalRate: 2
      name: "Warm up"
    - duration: 60
      arrivalRate: 5
      rampTo: 20
      name: "Ramp to typical load"
    - duration: 120
      arrivalRate: 20
      name: "Sustained typical load"
    - duration: 60
      arrivalRate: 20
      rampTo: 60
      name: "Ramp to peak load"
    - duration: 120
      arrivalRate: 60
      name: "Sustained peak load"
    - duration: 30
      arrivalRate: 60
      rampTo: 100
      name: "Spike load"
    - duration: 30
      arrivalRate: 100
      name: "Spike hold"
    - duration: 60
      arrivalRate: 60
      rampTo: 2
      name: "Cool down"

scenarios:
  # Weights add up to 100. Grouped by how the site renders each route, so the report shows
  # which kind of page slows down first:
  #   static/cached  - served from the build or the ISR cache; tests the Node server alone
  #   per request    - renders on every hit and calls the backend; tests site + server together
  #   generated      - CPU work on every request (OG images)
  # Build with the backend running (npm run dev:server first), then next start, so cached
  # pages hold real data. Use this same file for the before and after runs.
  - name: "Homepage (static)"
    weight: 25
    flow:
      - get:
          url: "/"
          afterResponse: "logUnexpectedStatus"

  - name: "Marketing pages (static)"
    weight: 12
    flow:
      - get:
          url: "/pricing"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/features"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/how-it-works"
          afterResponse: "logUnexpectedStatus"

  - name: "Templates (static)"
    weight: 8
    flow:
      - get:
          url: "/templates"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/templates/resume/resume-executive-clarity"
          afterResponse: "logUnexpectedStatus"

  - name: "Compare and ATS pages (static)"
    weight: 6
    flow:
      - get:
          url: "/compare/rezi"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/ats-checker"
          afterResponse: "logUnexpectedStatus"

  - name: "Release detail (ISR, cached)"
    weight: 6
    flow:
      - get:
          url: "/changelog/v3-30-1"
          afterResponse: "logUnexpectedStatus"

  - name: "Roadmap (cached; per request only if a column fails)"
    weight: 8
    flow:
      - get:
          url: "/roadmap"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/roadmap/todo"
          afterResponse: "logUnexpectedStatus"

  - name: "Changelog list (per request, calls the backend)"
    weight: 8
    flow:
      - get:
          url: "/changelog"
          afterResponse: "logUnexpectedStatus"

  - name: "Stats (per request, calls the backend)"
    weight: 5
    flow:
      - get:
          url: "/stats"
          afterResponse: "logUnexpectedStatus"

  - name: "Programs (per request: flags are read on each hit)"
    weight: 6
    flow:
      - get:
          url: "/affiliate"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/ambassador"
          afterResponse: "logUnexpectedStatus"

  - name: "Ambassador apply (per request, checks the session)"
    weight: 3
    flow:
      - get:
          url: "/ambassador/apply"
          afterResponse: "logUnexpectedStatus"

  - name: "Crawler files (static)"
    weight: 8
    flow:
      - get:
          url: "/sitemap.xml"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/robots.txt"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/llms.txt"
          afterResponse: "logUnexpectedStatus"
      - get:
          url: "/llms-full.txt"
          afterResponse: "logUnexpectedStatus"

  - name: "OG image (generated, CPU heavy)"
    weight: 5
    flow:
      - get:
          url: "/api/og?title=Load%20test"
          afterResponse: "logUnexpectedStatus"
