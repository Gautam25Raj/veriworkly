# Load test for @veriworkly/studio (authenticated dashboard/editor app,
# default local port 3001).
#
# Most of studio (dashboard, editor, admin, checkout) sits behind a login
# redirect, so the only route safe to hammer without a real session is
# /login. That's still useful - it's the first page every user hits, and it
# does its own auth-provider bootstrapping.
#
# To load test the authenticated app shell (dashboard/editor), add a scenario
# with a `cookie` header set from AUTH_COOKIE (see ../.env.example) once you
# have a real session cookie for a test account - see ../README.md.
#
# IMPORTANT: `next dev` is unoptimized. For prod-like numbers:
#   npm run build:studio && npm run start -w @veriworkly/studio -- -p 3001
config:
  target: "{{ $processEnvironment.LOCAL_STUDIO_URL }}"
  processor: "../processors/helpers.cjs"

  environments:
    local:
      target: "{{ $processEnvironment.LOCAL_STUDIO_URL }}"
    staging:
      target: "{{ $processEnvironment.STAGING_STUDIO_URL }}"
    production:
      target: "{{ $processEnvironment.PRODUCTION_STUDIO_URL }}"

  http:
    timeout: 15

  defaults:
    headers:
      user-agent: "veriworkly-load-test/1.0"

  phases:
    - duration: 30
      arrivalRate: 1
      name: "Warm up"
    - duration: 60
      arrivalRate: 1
      rampTo: 10
      name: "Ramp to typical load"
    - duration: 120
      arrivalRate: 10
      name: "Sustained typical load"
    - duration: 60
      arrivalRate: 10
      rampTo: 40
      name: "Ramp to peak load"
    - duration: 120
      arrivalRate: 40
      name: "Sustained peak load"
    - duration: 30
      arrivalRate: 40
      rampTo: 80
      name: "Spike"
    - duration: 30
      arrivalRate: 80
      name: "Spike hold"
    - duration: 60
      arrivalRate: 80
      rampTo: 1
      name: "Cool down"

scenarios:
  - name: "Login page"
    weight: 100
    flow:
      - get:
          url: "/login"
          afterResponse: "logUnexpectedStatus"
